<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Регистрация')}"></head>
<body class="auth-page">

<main class="auth-card">
    <div class="brand brand-center">
        <span>Учет студентов</span>
    </div>
    <h1>Регистрация</h1>
    <p class="muted">Создайте аккаунт, чтобы вести список студентов своей группы.</p>
    <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>
        <div class="field">
            <label for="login">Логин</label>
            <input type="text" id="login" th:field="*{login}" autocomplete="username" autofocus
                   th:classappend="${#fields.hasErrors('login')} ? 'invalid'">
            <p class="error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></p>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>
    <p class="auth-switch">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</main>
</body>
</html>
