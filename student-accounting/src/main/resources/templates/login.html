<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand brand-center">
        <span>Учет студентов</span>
    </div>
    <h1>Вход</h1>
    <div class="alert alert-success" th:if="${param.registered}">Регистрация прошла успешно. Войдите в систему.</div>
    <div class="alert alert-error" th:if="${param.error}">Неверный логин или пароль.</div>
    <div class="alert alert-info" th:if="${param.logout}">Вы вышли из системы.</div>
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="login">Логин</label>
            <input type="text" id="login" name="login" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
    <p class="auth-switch">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</main>
</body>
</html>
