<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Список студентов')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Список студентов</h1>
            <p class="muted" th:text="'Найдено: ' + ${#lists.size(students)}">Найдено: 0</p>
        </div>
        <a class="btn btn-primary" th:href="@{/students/new}">+ Добавить</a>
    </div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Сообщение</div>
    <form class="filter" th:action="@{/students}" method="get">
        <label for="form">Форма обучения</label>
        <select id="form" name="form" onchange="this.form.submit()">
            <option value="" th:selected="${selectedForm == null}">Все</option>
            <option th:each="f : ${studyForms}" th:value="${f}" th:text="${f.title}"
                    th:selected="${f == selectedForm}">Очная</option>
        </select>
        <noscript><button type="submit" class="btn btn-ghost">Показать</button></noscript>
        <a class="reset" th:if="${selectedForm != null}" th:href="@{/students}">Сбросить</a>
    </form>
    <div class="table-wrap" th:unless="${#lists.isEmpty(students)}">
        <table>
            <thead>
            <tr>
                <th>№</th>
                <th>ФИО</th>
                <th>Группа</th>
                <th>Телефон</th>
                <th>Форма обучения</th>
                <th class="col-actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s, it : ${students}">
                <td class="muted" th:text="${it.count}">1</td>
                <td class="strong" th:text="${s.fullName}">Иванов Иван Иванович</td>
                <td th:text="${s.groupNumber}">ИСП-21</td>
                <td class="nowrap" th:text="${s.phone}">+7 900 123-45-67</td>
                <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(s.studyForm.name())}"
                          th:text="${s.studyForm.title}">Очная</span></td>
                <td class="col-actions">
                    <a class="btn btn-small" th:href="@{/students/{id}/edit(id=${s.id})}">Изменить</a>
                    <form th:action="@{/students/{id}/delete(id=${s.id})}" method="post" class="inline"
                          onsubmit="return confirm('Удалить студента из списка?');">
                        <button type="submit" class="btn btn-small btn-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(students)}">
        <p th:if="${selectedForm == null}">Список пока пуст. Нажмите «Добавить», чтобы внести первого студента.</p>
        <p th:if="${selectedForm != null}">Студентов с такой формой обучения нет.</p>
    </div>
</main>

</body>
</html>
